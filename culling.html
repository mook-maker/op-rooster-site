<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>작전명 수탉 살처분이란 그림</title>
<script>
(function(){ var d = document.documentElement; if (window.self !== window.top || new URLSearchParams(location.search).has('embed')) { d.dataset.theme = 'light'; d.dataset.embed = '1'; } })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Nanum+Myeongjo:wght@700;800&display=swap">
<style>
/* 홈 「살처분이란」 그림: 발생 농장 중심 동심원(방역지역), 네모 = 농장, ✕ = 살처분 */
:root{
  --bg:#f5f6f7; --surface:#ffffff; --fg:#16181b; --muted:#5b6169; --safe:#b9bdc3;
  --accent:#7b302d; --accent-soft:#ecdcda; --accent-ink:#ffffff;
  --display:"Nanum Myeongjo","Noto Serif KR","AppleMyungjo","Batang",serif;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141619; --surface:#1c1f23; --fg:#eceef0; --muted:#a6acb3; --safe:#4a4f56;
  --accent:#d08a82; --accent-soft:#3a2523; --accent-ink:#141619; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141619; --surface:#1c1f23; --fg:#eceef0; --muted:#a6acb3; --safe:#4a4f56;
  --accent:#d08a82; --accent-soft:#3a2523; --accent-ink:#141619; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.6;padding:24px 16px 32px;word-break:keep-all}
html[data-embed] body{background:transparent;padding:4px 2px 8px}
main{max-width:400px;margin:0 auto}
.figtitle{font-family:var(--display);font-weight:800;font-size:16px;text-align:center;margin:0 0 8px}
main>svg{width:100%;height:auto;display:block;max-width:380px;margin-inline:auto}
.z1{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.2}
.z2,.z3{fill:none;stroke:var(--muted);stroke-width:1;stroke-dasharray:4 4}
.tz{fill:var(--muted);font-family:var(--sans);font-size:11.5px}
.ta{fill:var(--accent);font-family:var(--sans);font-size:12px;font-weight:600}
.tf{fill:var(--fg);font-family:var(--sans);font-size:11.5px;font-weight:600}
.f{fill:var(--surface);stroke:var(--safe);stroke-width:1.4}
.f-pre{fill:var(--surface);stroke:var(--accent);stroke-width:1.6}
.f-inf{fill:var(--accent);stroke:var(--accent);stroke-width:1.6}
.xm{stroke:var(--accent);stroke-width:2.4;stroke-linecap:round;fill:none}
.xm-w{stroke:var(--accent-ink)}
.legend{list-style:none;margin:14px auto 0;padding:0;display:grid;gap:8px;max-width:380px;font-size:14px;line-height:1.5}
.legend li{display:flex;gap:10px;align-items:flex-start}
.legend span{min-width:0}
.legend b{font-weight:600;margin-right:4px}
.ki{flex:none;width:22px;height:16px;margin-top:4px}
.k{flex:none;display:block}
.k-zone{border:1.2px dashed var(--muted);border-radius:50%;width:16px;height:16px;margin-top:4px;margin-inline:3px}
</style>
</head>
<body>
<main>
        <p class="figtitle">발생 농장 중심 동심원</p>
        <svg viewBox="0 0 360 360" role="img" aria-labelledby="figt">
          <title id="figt">발생 농장을 중심으로 관리지역 500m, 보호지역 3km, 예찰지역 10km 동심원. 네모는 농장이고, ✕ 표시가 있는 농장이 살처분된 농장.</title>
          <circle class="z3" cx="180" cy="180" r="170"/>
          <circle class="z2" cx="180" cy="180" r="122"/>
          <circle class="z1" cx="180" cy="180" r="70"/>
          <text class="tz" x="180" y="27" text-anchor="middle">예찰지역 10km</text>
          <text class="tz" x="180" y="75" text-anchor="middle">보호지역 3km</text>
          <text class="ta" x="180" y="127" text-anchor="middle">관리지역 500m</text>
          <rect class="f-inf" x="166" y="170" width="28" height="20" rx="2"/><path class="xm xm-w" d="M174 174 L186 186 M186 174 L174 186"/>
          <rect class="f-pre" x="116" y="164" width="28" height="20" rx="2"/><path class="xm" d="M124 168 L136 180 M136 168 L124 180"/>
          <rect class="f-pre" x="210" y="196" width="28" height="20" rx="2"/><path class="xm" d="M218 200 L230 212 M230 200 L218 212"/>
          <rect class="f" x="150" y="212" width="28" height="20" rx="2"/>
          <rect class="f-pre" x="236" y="118" width="28" height="20" rx="2"/><path class="xm" d="M244 122 L256 134 M256 122 L244 134"/>
          <rect class="f" x="84" y="236" width="28" height="20" rx="2"/>
          <rect class="f" x="258" y="214" width="28" height="20" rx="2"/>
          <rect class="f" x="296" y="262" width="28" height="20" rx="2"/>
          <rect class="f" x="36" y="112" width="28" height="20" rx="2"/>
          <rect class="f" x="250" y="46" width="28" height="20" rx="2"/>
          <text class="tf" x="180" y="162" text-anchor="middle">발생 농장</text>
        </svg>
        <ul class="legend">
          <li><svg class="ki" viewBox="0 0 28 20" aria-hidden="true"><rect class="f-inf" x="1" y="1" width="26" height="18" rx="2"/><path class="xm xm-w" d="M9 5 L19 15 M19 5 L9 15"/></svg><span><b>감염된 농장</b> 살처분</span></li>
          <li><svg class="ki" viewBox="0 0 28 20" aria-hidden="true"><rect class="f-pre" x="1" y="1" width="26" height="18" rx="2"/><path class="xm" d="M9 5 L19 15 M19 5 L9 15"/></svg><span><b>감염 안 된 농장</b> 방역당국이 위험하다고 판단해 예방적 살처분</span></li>
          <li><svg class="ki" viewBox="0 0 28 20" aria-hidden="true"><rect class="f" x="1" y="1" width="26" height="18" rx="2"/></svg><span><b>살처분하지 않음</b></span></li>
          <li><i class="k k-zone"></i><span><b>방역지역</b> 발생 농장에서 가까울수록 위험이 크다고 보는 구역. 500m 안은 예방적 살처분이 원칙이지만, 방역당국 판단에 따라 예외가 있습니다.</span></li>
        </ul>
      </main>
<script>
if (window.parent !== window){
  const post = () => window.parent.postMessage({ opRooster: 'culling', h: Math.ceil(document.querySelector('main').getBoundingClientRect().bottom + window.scrollY + 8) }, '*');
  new ResizeObserver(post).observe(document.body); post();
}
</script>
</body>
</html>
